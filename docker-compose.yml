# 默认入口 8080；验收环境可指定 APP_PORT 与独立 Compose 项目名称。
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  environment: &backend-environment
    DATABASE_URL: mysql+pymysql://map_army:${MYSQL_PASSWORD:?请运行 scripts/backend-env.py}@mysql:3306/map_army
    S3_ENDPOINT: http://s3:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?请运行 scripts/backend-env.py}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?请运行 scripts/backend-env.py}
    S3_BUCKET: ${S3_BUCKET:-map-army}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
  restart: unless-stopped

services:
  map-army:
    build: .
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:80'
    restart: unless-stopped
  mysql:
    extends:
      file: compose.infra.yml
      service: mysql
    restart: unless-stopped
  s3:
    extends:
      file: compose.infra.yml
      service: s3
    restart: unless-stopped
  init:
    <<: *backend
    user: '0:0'
    command: ['python', '-m', 'backend.app.bootstrap']
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      s3:
        condition: service_healthy
    volumes:
      - share-data:/legacy-shares:ro
  api:
    <<: *backend
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: 1536m
  worker:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    command: ['python', '-m', 'backend.app.worker']
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      # worker 没有 HTTP 端口，以 Blender 可执行文件作为进程镜像就绪探针。
      test: ['CMD', 'python', '-c', "import shutil,sys; sys.exit(0 if shutil.which('blender') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql-data:
  s3-data:
  # 旧 Node 服务的卷只读挂入迁移程序，绝不删除或就地修改。
  share-data:
    name: ${LEGACY_SHARE_VOLUME:-map_army_share-data}
