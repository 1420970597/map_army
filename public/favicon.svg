<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>map.army</title>
  <!-- 背景：深蓝主色，与原站主题一致 -->
  <rect width="64" height="64" rx="10" fill="#076391" />
  <!-- 军网：三纵三横，象征 MGRS 网格 -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.45">
    <line x1="22" y1="12" x2="22" y2="52" />
    <line x1="32" y1="12" x2="32" y2="52" />
    <line x1="42" y1="12" x2="42" y2="52" />
    <line x1="12" y1="22" x2="52" y2="22" />
    <line x1="12" y1="32" x2="52" y2="32" />
    <line x1="12" y1="42" x2="52" y2="42" />
  </g>
  <!-- 友军框架：蓝色矩形内嵌白色十字，取自 2525 的友军单位轮廓 -->
  <rect x="18" y="18" width="28" height="28" fill="#0B82D6" stroke="#ffffff" stroke-width="2.5" />
  <path d="M 28 24 L 36 40 L 28 40 M 36 24 L 36 40" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
</svg>
